name: Package and release

on:
  push:
    tags:
      - "v*.*.*"
  # Builds the installer without publishing, so the pipeline can be verified
  # before a tag is pushed. The release job is skipped for manual runs.
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to stamp into the test build"
        required: false
        default: "v0.0.0-test"

env:
  APP_NAME: PDFUnlocker
  APP_ID: "{{51FBCD54-2969-48AC-B0C0-E7ED765EE69D}"

jobs:
  render_installer_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install "jinja2~=3.1"

      # Rendered inline rather than via cuchi/jinja2-action: that action builds
      # a Docker image on every run, and its unpinned `pip install poetry` broke
      # the whole pipeline. Three substitutions don't justify the dependency.
      - name: Render Inno Setup script
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from jinja2 import Template

          template = Template(open('.github/workflows/installer.iss.j2').read())
          rendered = template.render(
              app_name=os.environ['APP_NAME'],
              app_id=os.environ['APP_ID'],
              version=os.environ['VERSION'],
          )
          open('installer.iss', 'w').write(rendered)
          print(rendered)
          PY

      - name: Upload installer script
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer.iss
            modpath.iss
            LICENSE

  package:
    runs-on: windows-latest
    needs: render_installer_script
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name pu pdf_unlocker.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pu
          path: dist/

  build_installer:
    runs-on: windows-latest
    needs: package
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compile .iss to .exe installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer_exe
          path: Output/

  release:
    runs-on: ubuntu-latest
    needs: build_installer
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: installer_exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.APP_NAME }}_${{ github.ref_name }}_Installer.exe
